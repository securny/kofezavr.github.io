---
layout: default
---

{% comment %}
  Site override of the Chirpy 7.6 home layout: the list shows the full text
  of every post plus its Telegram comments, instead of a summary card.
  The card is not wrapped in <a> because the content contains links and
  the Telegram widget <script>.
{% endcomment %}

{% include lang.html %}

{% assign all_pinned = site.posts | where: 'pin', 'true' %}
{% assign all_normal = site.posts | where_exp: 'item', 'item.pin != true and item.hidden != true' %}

{% assign posts = '' | split: '' %}

<!-- Get pinned posts on current page -->

{% assign visible_start = paginator.page | minus: 1 | times: paginator.per_page %}
{% assign visible_end = visible_start | plus: paginator.per_page %}

{% if all_pinned.size > visible_start %}
  {% if all_pinned.size > visible_end %}
    {% assign pinned_size = paginator.per_page %}
  {% else %}
    {% assign pinned_size = all_pinned.size | minus: visible_start %}
  {% endif %}

  {% for i in (visible_start..all_pinned.size) limit: pinned_size %}
    {% assign posts = posts | push: all_pinned[i] %}
  {% endfor %}
{% else %}
  {% assign pinned_size = 0 %}
{% endif %}

<!-- Get normal posts on current page -->

{% assign normal_size = paginator.posts | size | minus: pinned_size %}

{% if normal_size > 0 %}
  {% if pinned_size > 0 %}
    {% assign normal_start = 0 %}
  {% else %}
    {% assign normal_start = visible_start | minus: all_pinned.size %}
  {% endif %}

  {% assign normal_end = normal_start | plus: normal_size | minus: 1 %}

  {% for i in (normal_start..normal_end) %}
    {% assign posts = posts | push: all_normal[i] %}
  {% endfor %}
{% endif %}

<div id="post-list" class="flex-grow-1 px-xl-1">
  {% for post in posts %}
    <article class="card-wrapper card">
      <div class="post-preview row g-0">
        <div class="col-12">
          <div class="card-body">
            {%- comment -%}
              Not .card-title / .card-text: the theme clamps those to two lines for summary cards.
            {%- endcomment -%}
            <h1 class="post-title my-2 mt-md-0">
              <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </h1>

            <div class="post-meta d-flex align-items-end mb-3">
              <div class="me-auto">
                <!-- posted date -->
                <i class="far fa-calendar fa-fw me-1"></i>
                {% include datetime.html date=post.date lang=lang %}

                <!-- categories -->
                {% if post.categories.size > 0 %}
                  <i class="far fa-folder-open fa-fw me-1"></i>
                  <span class="categories">
                    {% for category in post.categories %}
                      {{ category }}
                      {%- unless forloop.last -%},{%- endunless -%}
                    {% endfor %}
                  </span>
                {% endif %}
              </div>

              {% if post.pin %}
                <div class="pin ms-1">
                  <i class="fas fa-thumbtack fa-fw"></i>
                  <span>{{ site.data.locales[lang].post.pin_prompt }}</span>
                </div>
              {% endif %}
            </div>
            <!-- .post-meta -->

            <div class="content mt-0 mb-3">
              {{ post.excerpt }}
            </div>

            {% if post.excerpt != post.content %}
              <div class="me-auto mb-3">
                <a href="{{ post.url | relative_url }}">{{ site.data.locales[lang].post.excerpt_separator }}</a>
              </div>
            {% endif %}

            {% include comments/telegram.html id=post.telegram-discussion %}
          </div>
          <!-- .card-body -->
        </div>
      </div>
    </article>
  {% endfor %}
</div>
<!-- #post-list -->

{% if paginator.total_pages > 1 %}
  {% include post-paginator.html %}
{% endif %}
