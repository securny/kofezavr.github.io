# The layout text of site

# ----- Commons label -----

layout:
  post: Публикация
  category: Категория
  tag: Тег

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Главная
  categories: Рубрики
  tags: Тэги
  archives: Архив
  about: Обо мне
  promo: Промокоды

# the text displayed in the search bar & search results
search:
  hint: поиск
  cancel: Отмена
  no_results: Упс! Ничего не найдено.

panel:
  lastmod: Недавно обновлено
  trending_tags: Популярные теги
  toc: Содержание

copyright:
  # Shown at the bottom of the post
  license:
    template: Публикация защищена лицензией :LICENSE_NAME.
    name: CC BY-NC-ND 4.0
    link: https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ru

  # Displayed in the footer
  brief: Все права защищены.
  verbose: >-
    Публикации на сайте защищены лицензией Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International (CC BY-NC-ND 4.0),
    если в тексте публикации не указано иное.

meta: Использует тему :THEME для :PLATFORM

not_found:
  statement: Извините, мы перепутали URL-адрес или он указывает на что-то несуществующее.

notification:
  update_found: Найден новый контент
  update: Обновить

theme:
  light: Светлая
  dark: Темная
  system: Системная

# ----- Posts related labels -----

post:
  written_by: Автор
  posted: Опубликовано
  updated: Обновлено
  words: слов
  pageview_measure: просмотров
  read_time:
    unit: мин.
    prompt: чтения
  edit: Редактировать этот пост
  relate_posts: Похожие посты
  share: Поделиться
  button:
    next: Следующий пост
    previous: Предыдущий пост
    copy_code:
      succeed: Скопировано!
    share_link:
      title: Скопировать ссылку
      succeed: Ссылка успешно скопирована!
  # pinned prompt of posts list on homepage
  pin_prompt: Закреплено
  # "read more" link under the post on homepage (custom _layouts/home.html)
  excerpt_separator: Читать дальше...

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%d.%m.%Y"
    dayjs: "DD.MM.YYYY"

# categories page
categories:
  category_measure:
    singular: категория
    plural: категории
  post_measure:
    singular: пост
    plural: посты
