<!-- Telegram Comments: widget attached to the channel discussion of the post -->
<!-- The iframe bottom (Telegram login block, 78px) is clipped: no foreign auth on the site (149-FZ, KoAP 13.55) -->
{% assign tg = include.id | default: page.telegram-discussion %}
{% if tg %}
  <style>
    .kz-tg-comments { overflow: hidden; }
    .kz-tg-comments iframe { margin-bottom: -78px !important; }
  </style>
  <div class="kz-tg-comments">
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-discussion="{{ tg }}"
      data-comments-limit="3" data-colorful="1"></script>
  </div>
  <p class="mt-2">
    <a href="https://t.me/{{ tg }}" target="_blank" rel="noopener">Обсудить в Telegram</a>
  </p>
{% endif %}
