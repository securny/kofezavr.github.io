<!-- Telegram Comments: widget attached to the channel discussion of the post -->
<!-- Loads only after consent (_includes/cookie-consent.html); the link to the discussion is always shown -->
<!-- The iframe bottom (Telegram login block, 78px) is clipped: no foreign auth on the site (149-FZ, KoAP 13.55) -->
{% assign tg = include.id | default: page.telegram-discussion %}
{% if tg %}
  <style>
    .kz-tg-comments { overflow: hidden; }
    .kz-tg-comments iframe { margin-bottom: -78px !important; }
  </style>
  <div class="kz-tg-comments" id="kz-tg-comments"></div>
  <a class="post-more mb-2" id="kz-tg-link" href="https://t.me/{{ tg }}" target="_blank" rel="noopener">
    Обсудить в Telegram
    <i class="fas fa-arrow-right" aria-hidden="true"></i>
  </a>
  <script>
    (window.kzAnalytics = window.kzAnalytics || []).push(function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-widget.js?22';
      s.setAttribute('data-telegram-discussion', '{{ tg }}');
      s.setAttribute('data-comments-limit', '3');
      s.setAttribute('data-colorful', '1');
      document.getElementById('kz-tg-comments').appendChild(s);
    });
  </script>
{% endif %}
